spring:
  application:
    name: company-ms
  datasource:
    url: jdbc:postgresql://localhost:5432/company-ms
    username: admin
    password: password123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  # rabbitmq
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8888/realms/jobboard

management:
  tracing:
    sampling:
      probability: 1.0
  #    export:
  #      zipkin:
  #        endpoint: "http://localhost:9411/zipkin/api/v2/spans"
  info:
    env:
      enabled: true
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: "*"
info:
  app:
    anyProp: "anyValue"


server:
  port: 8081
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      default-zone: "http://localhost:8761/eureka/"

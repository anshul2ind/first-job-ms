spring:
  application:
    name: review-ms
  datasource:
    url: jdbc:postgresql://localhost:5432/review-ms
    username: admin
    password: password123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
management:
  tracing:
    sampling:
      probability: 1.0
  #    export:
  #      zipkin:
  #        endpoint: "http://localhost:9411/zipkin/api/v2/spans"
  info:
    env:
      enabled: true
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: "*"
info:
  app:
    anyProp: "anyValue"

server:
  port: 8083

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      default-zone: "http://localhost:8761/eureka/"


